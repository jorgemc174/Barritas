name: Descomprimir proyecto

on:
  workflow_dispatch:
  push:
    paths:
      - 'metas-obs-listo.zip'
      - '.github/workflows/descomprimir-proyecto.yml'

permissions:
  contents: write

jobs:
  unzip-project:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Descomprimir ZIP
        run: |
          if [ ! -f metas-obs-listo.zip ]; then
            echo "No existe metas-obs-listo.zip"
            exit 0
          fi
          rm -rf metas-obs-listo
          unzip -o metas-obs-listo.zip
          cp -a metas-obs-listo/. .
          rm -rf metas-obs-listo
          rm -f metas-obs-listo.zip

      - name: Commit cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
          else
            git commit -m "Descomprimir proyecto inicial"
            git push
          fi
