<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Donar</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="page"><header class="header"><div><h1>Donación simulada</h1><p>Puedes donar una cantidad total y repartirla entre varias metas.</p></div><nav class="nav"><a href="/admin">Admin</a><a href="/bits">Bits</a><a href="/overlay" target="_blank">Overlay</a></nav></header>
<section class="grid"><div class="card"><h2>Total</h2><label>Total donado en euros</label><input id="totalEuros" type="number" min="0.01" step="0.01" value="100"><div class="help">Conversión simulada: 1 € = <span id="ppe">100</span> Bits.</div><div id="summary" class="summary-box"></div><button id="confirmDonation" class="primary">Confirmar donación simulada</button><div class="status" id="donateStatus"></div></div><div class="card"><h2>Reparto</h2><div id="allocations" class="allocation-list"></div></div></section></main>
<script src="/app.js"></script><script>
const A=window.MetasApp; let state=null;
function render(s){ state=s; A.qs('#ppe').textContent=A.number(state.settings.pointsPerEuro||100); const goals=A.activeGoals(state); A.qs('#allocations').innerHTML=goals.length?goals.map(g=>`<article class="allocation-card"><div><h3>${A.esc(g.name)}</h3><div class="muted">${A.esc(g.categoryName)} · ${A.esc(A.goalText(g))}</div></div><div><label>€ para esta meta</label><input data-allocation="${A.esc(g.id)}" type="number" min="0" step="0.01" placeholder="0.00"></div></article>`).join(''):'<div class="empty">No hay metas activas.</div>'; updateSummary(); }
function updateSummary(){ const total=Number(A.qs('#totalEuros').value||0); const allocated=A.qsa('[data-allocation]').reduce((sum,i)=>sum+Number(i.value||0),0); const left=total-allocated; const el=A.qs('#summary'); el.className='summary-box'+(left< -0.001?' bad-box':''); el.innerHTML=`Total: ${A.money(total)} €<br>Repartido: ${A.money(allocated)} €<br>${left>=0?'Sobra para bote':'Te pasas'}: ${A.money(Math.abs(left))} €`; }
async function load(){render(await A.api('/api/state'));}
document.addEventListener('input',ev=>{ if(ev.target.matches('#totalEuros,[data-allocation]')) updateSummary(); });
A.qs('#confirmDonation').addEventListener('click',async()=>{ const eurosTotal=Number(A.qs('#totalEuros').value||0); const allocations=A.qsa('[data-allocation]').map(i=>({goalId:i.dataset.allocation, euros:Number(i.value||0)})).filter(x=>x.euros>0); try{ await A.api('/api/mock/paypal-split',{method:'POST',body:JSON.stringify({eurosTotal,allocations})}); A.setStatus('#donateStatus','Donación simulada aplicada. OBS actualizado.','ok'); A.qsa('[data-allocation]').forEach(i=>i.value=''); await load(); }catch(e){ A.setStatus('#donateStatus',e.message,'bad'); }});
load(); A.connectEvents(render);
</script></body></html>
