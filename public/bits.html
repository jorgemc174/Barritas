<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bits</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="page"><header class="header"><div><h1>Bits simulados</h1><p>Elige meta, pulsa cantidad o escribe los Bits que quieras.</p></div><nav class="nav"><a href="/admin">Admin</a><a href="/donar">Donar</a><a href="/overlay" target="_blank">Overlay</a></nav></header>
<section class="grid"><div class="card"><h2>Elegir cantidad</h2><label>Meta elegida</label><select id="goalSelect"></select><label>Bits</label><input id="bitsAmount" type="number" min="1" step="1" placeholder="Ej: 2500"><div class="amount-grid"><button class="amount-btn" data-bits="100">100</button><button class="amount-btn" data-bits="500">500</button><button class="amount-btn" data-bits="1000">1000</button><button class="amount-btn" data-bits="2500">2500</button><button class="amount-btn" data-bits="5000">5000</button><button class="amount-btn" data-bits="10000">10000</button></div><div class="btn-row"><button id="sendBits" class="primary">Confirmar Bits</button></div><div class="status" id="bitsStatus"></div></div><div class="card"><h2>Metas disponibles</h2><div id="choices" class="choice-grid"></div></div></section></main>
<script src="/app.js"></script><script>
const A=window.MetasApp; let state=null, selected=null;
function render(s){ state=s; const goals=A.activeGoals(state); if(!selected && goals[0]) selected=goals[0].id; if(selected && !goals.some(g=>g.id===selected)) selected=goals[0]?.id||''; A.qs('#goalSelect').innerHTML=goals.length?goals.map(g=>`<option value="${A.esc(g.id)}" ${g.id===selected?'selected':''}>${A.esc(g.name)} · ${A.esc(g.categoryName)}</option>`).join(''):'<option value="">No hay metas activas</option>'; A.qs('#choices').innerHTML=goals.length?goals.map(g=>`<button class="choice ${g.id===selected?'selected':''}" data-goal="${A.esc(g.id)}"><span class="name">${A.esc(g.name)}</span><span class="muted">${A.esc(g.categoryName)}<br>${A.esc(A.goalText(g))}</span></button>`).join(''):'<div class="empty">No hay metas activas.</div>'; }
async function load(){ render(await A.api('/api/state')); }
A.qs('#goalSelect').addEventListener('change',ev=>{selected=ev.target.value; render(state);});
A.qs('#choices').addEventListener('click',ev=>{const b=ev.target.closest('[data-goal]'); if(!b)return; selected=b.dataset.goal; render(state);});
document.addEventListener('click',ev=>{const b=ev.target.closest('.amount-btn'); if(!b)return; A.qs('#bitsAmount').value=b.dataset.bits; A.qsa('.amount-btn').forEach(x=>x.classList.toggle('selected',x===b));});
A.qs('#sendBits').addEventListener('click',async()=>{const goalId=selected||A.qs('#goalSelect').value; const bits=Number(A.qs('#bitsAmount').value||0); if(!goalId)return A.setStatus('#bitsStatus','Elige una meta.','bad'); if(!bits||bits<=0)return A.setStatus('#bitsStatus','Pon una cantidad válida.','bad'); try{await A.api('/api/mock/bits',{method:'POST',body:JSON.stringify({goalId,bits})}); A.setStatus('#bitsStatus',`${A.number(bits)} Bits aplicados. OBS actualizado.`,'ok'); A.qs('#bitsAmount').value=''; await load();}catch(e){A.setStatus('#bitsStatus',e.message,'bad');}});
load(); A.connectEvents(render);
</script></body></html>
